<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CFIB Durham - Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Montserrat', sans-serif; background-color: #f4f7f9; padding: 20px; }
        
        .header {
            background: linear-gradient(135deg, #254B87 0%, #D31145 100%);
            color: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .header h1 { font-size: 28px; margin-bottom: 10px; }
        .header p { font-size: 16px; opacity: 0.9; }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .stat-card .number {
            font-size: 36px;
            font-weight: 700;
            color: #D31145;
            margin-bottom: 10px;
        }
        
        .stat-card .label {
            font-size: 14px;
            color: #656465;
            font-weight: 600;
        }
        
        .actions {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: #D31145;
            color: white;
        }
        
        .btn-primary:hover {
            background: #254B87;
        }
        
        .btn-secondary {
            background: white;
            color: #254B87;
            border: 2px solid #254B87;
        }
        
        .btn-secondary:hover {
            background: #254B87;
            color: white;
        }
        
        .submissions-container {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .submissions-container h2 {
            color: #254B87;
            font-size: 24px;
            margin-bottom: 20px;
        }
        
        .submission-card {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }
        
        .submission-card:hover {
            border-color: #D31145;
            box-shadow: 0 4px 12px rgba(211, 17, 69, 0.1);
        }
        
        .submission-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .submission-header .business-name {
            font-size: 20px;
            font-weight: 700;
            color: #254B87;
        }
        
        .submission-header .timestamp {
            font-size: 14px;
            color: #656465;
        }
        
        .submission-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .detail-item {
            display: flex;
            flex-direction: column;
        }
        
        .detail-item .label {
            font-size: 12px;
            color: #656465;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        
        .detail-item .value {
            font-size: 16px;
            color: #333;
            font-weight: 600;
        }
        
        .no-data {
            text-align: center;
            padding: 60px 20px;
            color: #656465;
        }
        
        .no-data h3 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        @media (max-width: 768px) {
            .submission-details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎯 CFIB Durham - Admin Dashboard</h1>
        <p>Track and manage calculator submissions</p>
    </div>
    
    <div class="stats" id="statsContainer">
        <div class="stat-card">
            <div class="number" id="totalSubmissions">0</div>
            <div class="label">Total Submissions</div>
        </div>
        <div class="stat-card">
            <div class="number" id="todaySubmissions">0</div>
            <div class="label">Today</div>
        </div>
        <div class="stat-card">
            <div class="number" id="thisWeekSubmissions">0</div>
            <div class="label">This Week</div>
        </div>
        <div class="stat-card">
            <div class="number" id="avgEmployees">0</div>
            <div class="label">Avg Employees</div>
        </div>
    </div>
    
    <div class="actions">
        <button class="btn btn-primary" onclick="downloadCSV()">📥 Export to CSV</button>
        <button class="btn btn-secondary" onclick="clearAllData()">🗑️ Clear All Data</button>
        <button class="btn btn-secondary" onclick="location.href='index.html'">← Back to Tools</button>
    </div>
    
    <div class="submissions-container">
        <h2>Recent Submissions</h2>
        <div id="submissionsContainer"></div>
    </div>
    
    <script>
        function loadSubmissions() {
            const submissions = JSON.parse(localStorage.getItem('cfib_all_submissions') || '[]');
            
            if (submissions.length === 0) {
                document.getElementById('submissionsContainer').innerHTML = `
                    <div class="no-data">
                        <h3>No submissions yet</h3>
                        <p>Calculator submissions will appear here</p>
                    </div>
                `;
                return;
            }
            
            // Calculate stats
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const weekAgo = new Date(today.getTime() - (7 * 24 * 60 * 60 * 1000));
            
            const todayCount = submissions.filter(s => new Date(s.timestamp) >= today).length;
            const weekCount = submissions.filter(s => new Date(s.timestamp) >= weekAgo).length;
            const avgEmp = Math.round(submissions.reduce((sum, s) => sum + s.employees, 0) / submissions.length);
            
            document.getElementById('totalSubmissions').textContent = submissions.length;
            document.getElementById('todaySubmissions').textContent = todayCount;
            document.getElementById('thisWeekSubmissions').textContent = weekCount;
            document.getElementById('avgEmployees').textContent = avgEmp;
            
            // Display submissions (most recent first)
            const sortedSubmissions = submissions.sort((a, b) => b.timestamp - a.timestamp);
            
            let html = '';
            sortedSubmissions.forEach(sub => {
                html += `
                    <div class="submission-card">
                        <div class="submission-header">
                            <div class="business-name">${sub.businessName || 'Unnamed Business'}${sub.cityLocation ? ' - ' + sub.cityLocation : ''}</div>
                            <div class="timestamp">${sub.calculatedAt}</div>
                        </div>
                        <div class="submission-details">
                            <div class="detail-item">
                                <div class="label">Structure</div>
                                <div class="value">${formatValue(sub.businessStructure)}</div>
                            </div>
                            <div class="detail-item">
                                <div class="label">Employees</div>
                                <div class="value">${sub.employees}</div>
                            </div>
                            <div class="detail-item">
                                <div class="label">Industry</div>
                                <div class="value">${formatValue(sub.industry)}</div>
                            </div>
                            <div class="detail-item">
                                <div class="label">Card Volume</div>
                                <div class="value">${formatValue(sub.cardVolume)}</div>
                            </div>
                            <div class="detail-item">
                                <div class="label">Admin Hours/Week</div>
                                <div class="value">${sub.adminHours} hrs</div>
                            </div>
                            <div class="detail-item">
                                <div class="label">HR Confidence</div>
                                <div class="value">${sub.hrConfidence}/10</div>
                            </div>
                            <div class="detail-item">
                                <div class="label">Legal Events</div>
                                <div class="value">${sub.legalEvents}</div>
                            </div>
                            <div class="detail-item">
                                <div class="label">Monthly Fee</div>
                                <div class="value">$${sub.monthlyMembership}</div>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            document.getElementById('submissionsContainer').innerHTML = html;
        }
        
        function formatValue(val) {
            if (!val) return 'N/A';
            // Capitalize first letter and replace underscores
            return val.charAt(0).toUpperCase() + val.slice(1).replace(/_/g, ' ');
        }
        
        function downloadCSV() {
            const submissions = JSON.parse(localStorage.getItem('cfib_all_submissions') || '[]');
            
            if (submissions.length === 0) {
                alert('No submissions to export');
                return;
            }
            
            // CSV headers
            const headers = [
                'Business Name',
                'City/Location',
                'Timestamp',
                'Pain Point',
                'Structure',
                'Employees',
                'Industry',
                'Card Volume',
                'Payroll Method',
                'Shipping',
                'Admin Hours/Week',
                'HR Confidence',
                'Total Legal Events',
                'Legal: Employment Changes',
                'Legal: Policy Updates',
                'Legal: Contract Reviews',
                'Legal: General Advice',
                'Monthly Membership',
                'Annual Membership'
            ];
            
            // CSV rows
            const rows = submissions.map(sub => [
                sub.businessName || '',
                sub.cityLocation || '',
                sub.calculatedAt || '',
                sub.painPoint || 'Not selected',
                sub.businessStructure || '',
                sub.employees || '',
                sub.industry || '',
                sub.cardVolume || '',
                sub.payrollMethod || '',
                sub.shipping || '',
                sub.adminHours || '',
                sub.hrConfidence || '',
                sub.legalEvents || '',
                sub.legalEventDetails?.employment ? 'Yes' : 'No',
                sub.legalEventDetails?.policy ? 'Yes' : 'No',
                sub.legalEventDetails?.contract ? 'Yes' : 'No',
                sub.legalEventDetails?.advice ? 'Yes' : 'No',
                sub.monthlyMembership || '',
                sub.annualMembership || ''
            ]);
            
            // Create CSV content
            let csvContent = headers.join(',') + '\n';
            rows.forEach(row => {
                csvContent += row.map(cell => `"${cell}"`).join(',') + '\n';
            });
            
            // Download
            const blob = new Blob([csvContent], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `cfib-submissions-${new Date().toISOString().split('T')[0]}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
        }
        
        function clearAllData() {
            if (confirm('Are you sure you want to delete all submissions? This cannot be undone.')) {
                localStorage.removeItem('cfib_all_submissions');
                loadSubmissions();
                alert('All data cleared');
            }
        }
        
        // Load on page load
        window.addEventListener('DOMContentLoaded', loadSubmissions);
    </script>
</body>
</html>
